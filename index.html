<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>My To-Do List</h1>
            <p class="date" id="current-date"></p>
        </div>

        <div class="input-section">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="todo-input" 
                    placeholder="Add a new task..."
                    autocomplete="off"
                >
                <button id="add-btn" class="btn-add">Add Task</button>
            </div>
            <div class="priority-section">
                <label>Priority:</label>
                <select id="priority-select">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
        </div>

        <div class="filter-section">
            <button id="filter-all" class="filter-btn active" data-filter="all">All</button>
            <button id="filter-active" class="filter-btn" data-filter="active">Active</button>
            <button id="filter-completed" class="filter-btn" data-filter="completed">Completed</button>
            <button id="filter-high" class="filter-btn" data-filter="high">High Priority</button>
            <span class="task-count" id="task-count">0 tasks</span>
        </div>

        <div class="stats">
            <div class="stat">
                <span class="stat-label">Total:</span>
                <span class="stat-value" id="stat-total">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Completed:</span>
                <span class="stat-value" id="stat-completed">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Remaining:</span>
                <span class="stat-value" id="stat-remaining">0</span>
            </div>
        </div>

        <ul class="todo-list" id="todo-list"></ul>

        <div class="empty-state" id="empty-state">
            <p>📝 No tasks yet. Add one to get started!</p>
        </div>

        <div class="action-buttons">
            <button id="clear-completed" class="btn-action">Clear Completed</button>
            <button id="clear-all" class="btn-action btn-danger">Clear All</button>
            <button id="export-btn" class="btn-action">Export Tasks</button>
            <button id="import-btn" class="btn-action">Import Tasks</button>
        </div>

        <input type="file" id="import-file" accept=".json" style="display: none;">
    </div>

    <script src="script.js"></script>
</body>
</html>
